services:
  db:
    image: postgres:15-alpine
    container_name: aegis_db
    restart: always
    environment:
      POSTGRES_USER: aegis_user
      POSTGRES_PASSWORD: aegis_password
      POSTGRES_DB: aegis_metadata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aegis_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
